on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Use PAT instead of GITHUB_TOKEN to trigger GoReleaser workflow
          # GITHUB_TOKEN doesn't trigger other workflows by design
          token: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          release-type: go
